<!doctype html><html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0e"><meta name="robots" content="noindex">
<title>JARVIS — подключение устройства</title>
<style>
:root{--bg:#07090d;--text:#eef2f8;--muted:#a3adbf;--faint:#7d8798;--accent:#3ddc97;--warn:#f5b45c;--danger:#f2708a;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:
 radial-gradient(800px 420px at 20% -10%,rgba(61,220,151,.10),transparent 60%),
 radial-gradient(700px 420px at 90% 0%,rgba(127,176,255,.08),transparent 62%),var(--bg);
 color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Segoe UI Variable Display",Inter,sans-serif}
.card{width:min(420px,100%);padding:26px 22px;border-radius:24px;border:1px solid var(--line);
 background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
 backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 30px 80px -40px #000;text-align:center}
.mark{width:52px;height:52px;margin:0 auto 14px;border-radius:16px;display:grid;place-content:center;font-weight:700;font-size:20px;
 color:var(--accent);background:linear-gradient(155deg,rgba(61,220,151,.22),rgba(61,220,151,.04));border:1px solid rgba(61,220,151,.32)}
h1{font-size:20px;margin:0 0 8px;letter-spacing:-.02em}
p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.state{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:14px;margin:16px 0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:8px;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.dot.ok{background:var(--accent);animation:none}
.dot.bad{background:var(--danger);animation:none}
button{width:100%;height:46px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
button.primary{background:linear-gradient(160deg,#63f0b4,#27c286);border-color:rgba(120,255,200,.5);color:#04170f;margin-top:10px}
button:disabled{opacity:.5}
.fine{font-size:11.5px;color:var(--faint);margin-top:14px;line-height:1.5}
</style></head>
<body>
<main class="card">
  <div class="mark">J</div>
  <h1>Подключение устройства</h1>
  <p>Этот телефон получит доступ к JARVIS после подтверждения на компьютере.</p>
  <div class="state" id="state"><span class="dot"></span><span id="state-text">Ожидаю подтверждения…</span></div>
  <button id="passkey" class="primary" hidden>Включить Face ID</button>
  <p class="fine" id="fine">Запрос одноразовый и действует 60 секунд. На компьютере подтвердите устройство в JARVIS.</p>
</main>
<script>
(() => {
  const token = location.pathname.split('/').filter(Boolean).pop() || '';
  const text = document.getElementById('state-text');
  const dot = document.querySelector('.dot');
  const state = document.getElementById('state');
  const passkeyButton = document.getElementById('passkey');
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const unb64 = (value) => {
    const pad = '='.repeat((4 - value.length % 4) % 4);
    const raw = atob((value + pad).replace(/-/g,'+').replace(/_/g,'/'));
    return Uint8Array.from(raw, (ch) => ch.charCodeAt(0));
  };
  const post = async (path, body) => {
    const response = await fetch(path, {method:'POST', credentials:'same-origin', cache:'no-store',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {})});
    let data = null; try { data = await response.json(); } catch { }
    if (!response.ok) throw new Error((data && (data.detail || data.message)) || ('HTTP ' + response.status));
    return data || {};
  };
  const get = async (path) => {
    const response = await fetch(path, {credentials:'same-origin', cache:'no-store'});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return response.json();
  };

  const registerPasskey = async () => {
    passkeyButton.disabled = true;
    text.textContent = 'Запрашиваю Face ID…';
    try {
      const {csrf} = await get('/auth/csrf');
      const beginResponse = await fetch('/api/auth/passkey/register/begin', {method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/json','x-owner-csrf':csrf}, body: JSON.stringify({label: 'iPhone'})});
      const begin = await beginResponse.json();
      if (!beginResponse.ok) throw new Error(begin.detail || 'Начать регистрацию не удалось');
      const publicKey = begin.options;
      publicKey.challenge = unb64(publicKey.challenge);
      publicKey.user.id = unb64(publicKey.user.id);
      publicKey.excludeCredentials = (publicKey.excludeCredentials || []).map((c) => ({...c, id: unb64(c.id)}));
      const created = await navigator.credentials.create({publicKey});
      const payload = {
        id: created.id, rawId: b64(created.rawId), type: created.type,
        response: {
          clientDataJSON: b64(created.response.clientDataJSON),
          attestationObject: b64(created.response.attestationObject),
          transports: created.response.getTransports ? created.response.getTransports() : [],
        },
      };
      const complete = await fetch('/api/auth/passkey/register/complete', {method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/json','x-owner-csrf':csrf},
        body: JSON.stringify({challenge_id: begin.challenge_id, credential: payload, label: 'iPhone'})});
      if (!complete.ok) throw new Error('Регистрация не подтверждена');
      dot.className = 'dot ok';
      text.textContent = 'Face ID включён. Открываю JARVIS…';
      setTimeout(() => location.replace('/'), 900);
    } catch (error) {
      dot.className = 'dot bad';
      text.textContent = 'Face ID не включён: ' + (error.message || 'попробуйте ещё раз');
      passkeyButton.disabled = false;
    }
  };

  passkeyButton.addEventListener('click', registerPasskey);

  (async () => {
    try {
      const status = await get('/auth/pair/' + encodeURIComponent(token));
      if (status.status === 'approved') {
        const claimed = await post('/auth/pair/' + encodeURIComponent(token) + '/claim');
        if (claimed.status === 'paired') {
          dot.className = 'dot ok';
          text.textContent = 'Устройство подключено.';
          if (window.PublicKeyCredential && navigator.credentials && window.isSecureContext) {
            passkeyButton.hidden = false;
            setTimeout(registerPasskey, 600);
          } else {
            setTimeout(() => location.replace('/'), 900);
          }
          return;
        }
      }
    } catch { /* keep polling */ }
    setInterval(async () => {
      try {
        const status = await get('/auth/pair/' + encodeURIComponent(token));
        if (status.status === 'approved') {
          const claimed = await post('/auth/pair/' + encodeURIComponent(token) + '/claim');
          if (claimed.status === 'paired') {
            dot.className = 'dot ok';
            text.textContent = 'Устройство подключено.';
            if (window.PublicKeyCredential && navigator.credentials && window.isSecureContext) {
              passkeyButton.hidden = false;
              setTimeout(registerPasskey, 400);
            } else {
              setTimeout(() => location.replace('/'), 800);
            }
          }
        }
      } catch (error) {
        clearInterval(0);
        dot.className = 'dot bad';
        text.textContent = 'Ссылка больше не действует. Создайте новую на компьютере.';
        state.setAttribute('role', 'alert');
      }
    }, 2000);
  })();
})();
</script>
</body></html>
