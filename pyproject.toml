[project]
name = "jarvis"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "loguru",
    "httpx>=0.28",
    "sqlmodel>=0.0.22",
    "diskcache>=5.6",
    "tiktoken>=0.8",
    "jinja2",
    "python-multipart",
    "pypdf>=5.0",
    "watchdog>=4.0",
    "apscheduler>=3.10",
    "pandas>=3.0.6",
    "numpy>=2.4.6",
    "duckdb>=1.5.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "catboost>=1.2.10",
    "matplotlib>=3.11.2",
    "torch==2.6.0+cu124 ; sys_platform == 'win32'",
    "torchvision==0.21.0+cu124 ; sys_platform == 'win32'",
    "torchaudio==2.6.0+cu124 ; sys_platform == 'win32'",
    "sentence-transformers>=6.1.0",
    "chromadb>=1.5.9",
    "setfit>=1.2.0",
    "ebooklib>=0.20",
    "bs4>=0.0.2",
    "rapidfuzz==3.14.6",
    "webauthn>=3.0.1",
    "qrcode>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "pytest-xdist>=3.8.0",
    "pytest-testmon>=2.2.0",
    "hypothesis>=6.170.2",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "diskcache",
    "pandas.*",
    "sklearn.*",
    "joblib",
    "yaml",
    "scipy.*",
    "catboost.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]
